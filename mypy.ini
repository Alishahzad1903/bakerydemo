; Type-checking config for the VideoGen integration (bakerydemo.videos).
; The wider legacy codebase is not type-checked, so global settings are lenient
; and strict checks are scoped to the new app, which also talks to the
; APIMatic-generated `videogen` SDK (shipped `py.typed`, generated under
; --strict). The django-stubs plugin gives Django models proper field types.
[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main
ignore_missing_imports = True
follow_imports = silent

[mypy.plugins.django-stubs]
django_settings_module = bakerydemo.settings.dev

[mypy-bakerydemo.videos.*]
disallow_untyped_defs = False
warn_unreachable = True

; Generated code — excluded from type checking, as it is from linting.
[mypy-bakerydemo.videos.migrations.*]
ignore_errors = True
